<html lang="{{lang}}">

<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  {{> head-meta}}
  {{> head-icons}}
  <!-- The two above-the-fold faces, preloaded so they start with the HTML
       rather than after the CSS. crossorigin is required even same-origin,
       or the preload is fetched twice. -->
  <link rel="preload" href="{{prefix}}assets/webfonts/open-sans/open-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{prefix}}assets/webfonts/open-sans/open-sans-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  {{#each stylesheets}}
  <link rel="stylesheet" href="{{href}}" />
  {{/each}}
  {{#if headExtra}}

  {{headExtra}}
  {{/if}}
</head>

<body{{bodyAttr}}>
  <div id="page-wrapper">
    <!-- Logo, nav and switcher in one band, the green rule its bottom edge.
         The prelude sits inside it so it can hang just below that rule. -->
    <div id="masthead">
      {{> header}}
      {{> nav}}
      {{#if prelude}}
      {{prelude}}
      {{/if}}
    </div>

    {{main}}

    {{> footer}}
  </div>

  {{> scripts}}
  {{#if tailScripts}}

  {{tailScripts}}
  {{/if}}
</body>

</html>
