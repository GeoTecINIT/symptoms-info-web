<!-- Main -->
<!-- One page for every missing path in both locales, hence both languages.
     It is rootRelative, so {{prefix}} is "/": Hosting serves this at whatever
     depth was asked for, where a relative path would resolve against it. -->
<section id="main">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="content">
          <article class="box page-content">
            <header>
              <h2>Page not found</h2>
              <p lang="es">Página no encontrada</p>
            </header>
            <section>
              <p>
                The page you were looking for does not exist or has moved.
                <a href="{{prefix}}index.html">Go to the SyMptOMS home page</a>.
              </p>
              <p lang="es">
                La página que buscas no existe o ha cambiado de dirección.
                <a href="{{prefix}}es/index.html">Ir a la página de inicio de SyMptOMS</a>.
              </p>
            </section>
          </article>
        </div>
      </div>
    </div>
  </div>
</section>
