<!-- Main -->
<section id="main">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <!-- The index: blog.js builds the cards and the pager, three at a time. -->
        <section class="box features">
          <h2 class="major"><span>SyMptOMS posts</span></h2>
          <div>
            <div id="more_posts" class="row"></div>
            <div id="post-pager"></div>
          </div>
        </section>
      </div>
      <div class="col-12">
        <!-- Browsing above, reading below. -->
        <hr class="blog-split">
      </div>
      <div class="col-3 col-12-medium blog-side">
        <!-- The post switcher, filled by blog.js. Sticky beside the article,
             and hidden below 981px, where the grid above it does the same job. -->
        <div id="post-rail"></div>
      </div>
      <div class="col-9 col-12-medium blog-main">
        <div class="content">
          <!-- Content -->
          <article id="last_post" class="box page-content"></article>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- @scripts -->
<script>
  // Rendering lives in assets/js/blog.js -- one copy for both locales.
  // Fetch /geotecblog, not the database root: database.rules.json scopes .read
  // to the three public nodes, and RTDB refuses a request for any path the
  // caller cannot read in full rather than filtering it.
  initBlog({
    endpoint: "https://symptoms-web-default-rtdb.europe-west1.firebasedatabase.app/geotecblog.json",
    lang: "{{lang}}",
    fallbackUrl: "{{strings.blogFallbackUrl}}",
    strings: {
      loading: "{{strings.blogLoading}}",
      empty: "{{strings.blogEmpty}}",
      error: "{{strings.blogError}}",
      errorLinkText: "{{strings.blogErrorLink}}",
      seeOriginal: "{{strings.blogSeeOriginal}}",
      pagerLabel: "{{strings.blogPagerLabel}}",
      pagerPrev: "{{strings.blogPagerPrev}}",
      pagerNext: "{{strings.blogPagerNext}}",
      pagerPage: "{{strings.blogPagerPage}}",
      readMore: "{{strings.blogReadMore}}",
      allPosts: "{{strings.blogAllPosts}}",
      inThisPost: "{{strings.blogInThisPost}}",
      readingTime: "{{strings.blogReadingTime}}",
      backToPosts: "{{strings.blogBackToPosts}}"
    }
  });
</script>
<!-- /@scripts -->
