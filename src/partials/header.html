<!-- Header: the logo and tagline, top left of the masthead. One link to the
     home page covers both, so they are one tab stop rather than two links to
     the same place. main.js copies the <img> alone into the mobile title bar. -->
<header id="header">
  <div class="logo">
    <h1>
      <a href="{{homeHref}}" id="logo"><img src="{{prefix}}images/logo-symptoms.png" alt="{{strings.logoAlt}}" width="1000" height="221" /><span class="tagline"><span>{{strings.taglineTop}}</span> <span>{{strings.taglineBottom}}</span></span></a>
    </h1>
  </div>
</header>
